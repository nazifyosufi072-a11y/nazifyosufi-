name: Instant Vercel Deployment Trigger

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  fast-deploy:
    name: Instant Deployment Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Build Fast
        run: |
          npm ci --prefer-offline
          npx prisma generate
          npm run build
